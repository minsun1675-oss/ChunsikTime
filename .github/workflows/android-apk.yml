name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    env:
      TTB_SIGNING_ENABLED: ${{ secrets.TTB_KEYSTORE_BASE64 != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChunsikTime-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Assemble signed release APK (when signing Secrets are configured)
        if: ${{ env.TTB_SIGNING_ENABLED == 'true' }}
        env:
          TTB_KEYSTORE_BASE64: ${{ secrets.TTB_KEYSTORE_BASE64 }}
          TTB_KEYSTORE_PASSWORD: ${{ secrets.TTB_KEYSTORE_PASSWORD }}
          TTB_KEY_ALIAS: ${{ secrets.TTB_KEY_ALIAS }}
          TTB_KEY_PASSWORD: ${{ secrets.TTB_KEY_PASSWORD }}
        run: |
          printf '%s' "$TTB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ttobagi.jks"
          export TTB_KEYSTORE_PATH="$RUNNER_TEMP/ttobagi.jks"
          gradle --no-daemon assembleRelease
      - name: Upload signed release APK
        if: ${{ env.TTB_SIGNING_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: TTOBAGI-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
